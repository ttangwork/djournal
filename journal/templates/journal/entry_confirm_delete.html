{% extends 'journal/base.html' %}

{% block title %}Delete Entry{% endblock %}

{% block content %}
    <div class="bg-white rounded shadow p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Delete "{{ entry.title }}"?</h1>
        <p class="text-gray-500 mb-6">This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="bg-red-500 text-white px-6 py-2 rounded hover:bg-red-600">Yes, delete</button>
            <a href="{% url 'entry_detail' entry.pk %}" class="ml-4 text-gray-500 hover:underline">Cancel</a>
        </form>
    </div>
{% endblock %}
