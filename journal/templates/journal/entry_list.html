{% extends 'journal/base.html' %}

{% block title %}My Journal{% endblock %}

{% block content %}
    <h1 class="text-3xl font-bold text-gray-800 mb-6">My Journal</h1>
    {% for entry in entries %}
        <div class="bg-white rounded shadow p-4 mb-4">
            <h2 class="text-xl font-semibold">
                <a href="{% url 'entry_detail' entry.pk %}" class="text-blue-600 hover:underline">{{ entry.title }}</a>
            </h2>
            <p class="text-gray-400 text-sm mt-1">{{ entry.created_at|date:"F j, Y" }}</p>
        </div>
    {% empty %}
        <p class="text-gray-500">No entries yet.</p>
    {% endfor %}
{% endblock %}
