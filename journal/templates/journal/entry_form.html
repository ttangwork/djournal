{% extends 'journal/base.html' %}

{% block title %}{% if entry %}Edit Entry{% else %}New Entry{% endif %}{% endblock %}

{% block content %}
    <h1 class="text-3xl font-bold text-gray-800 mb-6">{% if entry %}Edit Entry{% else %}New Entry{% endif %}</h1>
    <form method="post" class="bg-white rounded shadow p-6">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 font-medium mb-1" for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ entry.title }}" required
                class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 font-medium mb-1" for="body">Body</label>
            <textarea id="body" name="body" rows="10" required
                class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">{{ entry.body }}</textarea>
        </div>
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Save</button>
        <a href="{% url 'entry_list' %}" class="ml-4 text-gray-500 hover:underline">Cancel</a>
    </form>
{% endblock %}
