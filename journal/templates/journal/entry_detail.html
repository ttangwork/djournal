{% extends 'journal/base.html' %}

{% block title %}{{ entry.title }}{% endblock %}

{% block content %}
    <h1 class="text-3xl font-bold text-gray-800 mb-2">{{ entry.title }}</h1>
    <p class="text-gray-400 text-sm mb-6">{{ entry.created_at|date:"F j, Y" }}</p>
    <div class="bg-white rounded shadow p-6 mb-6">
        <p class="text-gray-700 whitespace-pre-wrap">{{ entry.body }}</p>
    </div>
    <div class="flex gap-4">
        <a href="{% url 'entry_edit' entry.pk %}" class="text-blue-600 hover:underline">Edit</a>
        <a href="{% url 'entry_delete' entry.pk %}" class="text-red-500 hover:underline">Delete</a>
    </div>
{% endblock %}
