{% extends 'journal/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="bg-white rounded shadow p-6 max-w-sm mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Login</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1" for="id_username">Username</label>
                <input type="text" name="username" id="id_username" required
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-1" for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Login</button>
        </form>
    </div>
{% endblock %}
